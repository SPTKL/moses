[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pluto-example"
version = "0.1.0"
description = "Standalone NYC PLUTO example using the installed Moses geospatial library"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "moses-geo>=0.1.0,<0.2",
  "dbt-duckdb>=1.11,<1.12", "dbt-core>=1.12,<1.13", "sqlglot>=30.23,<31",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1.2", "hatchling>=1.27"]

[project.scripts]
pluto-example = "pluto_example.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pluto_example"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: optional integration requiring DuckDB extensions"]
